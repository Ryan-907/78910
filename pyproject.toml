[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-sim"
version = "0.1.0"
description = "Contextual Integrity gate simulation for LLM agents (Riverside Medical Clinic)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["core", "world", "pipeline", "evaluation", "legacy", "reporting"]
